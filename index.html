<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KS Crypto Course DApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>KS Crypto Course DApp</h1>

    <button id="connect">Connect Wallet</button>
    <p id="wallet">Not connected</p>

    <section>
      <h2>Wallet Verification</h2>
      <input id="token" placeholder="Enter course token">
      <button id="verify">Verify Wallet</button>
    </section>

    <section>
      <h2>Sepolia Faucet</h2>
      <button id="claim">Claim 0.1 Sepolia ETH</button>
    </section>

    <section>
      <h2>NFT</h2>
      <button id="mint">Mint NFT</button>
      <input id="tokenId" placeholder="Token ID">
      <button id="viewNFT">View NFT URI</button>
      <p id="nftUri"></p>
    </section>

    <p id="status"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
